name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        release:
          - type: Debug
            suffix: "-debug"
          - type: Release
            suffix: ""

    name: Build (${{ matrix.release.type }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 5.0.x

      - name: Replace SharpHound library refs with git-dev
        run: |
          grep -rl --include="*.csproj" 'PackageReference Include="SharpHoundCommon"' . \
            | while IFS= read -r csproj; do
                sed -i "s|<PackageReference Include=\"SharpHoundCommon\" Version=\"[^\"]*\" />|<PackageReference Include=\"SharpHoundCommon\" Version=\"git-dev\" />|" $csproj
              done
          grep -rl --include="*.csproj" 'PackageReference Include="SharpHoundRPC"' . \
            | while IFS= read -r csproj; do
                sed -i "s|<PackageReference Include=\"SharpHoundRPC\" Version=\"[^\"]*\" />|<PackageReference Include=\"SharpHoundRPC\" Version=\"git-dev\" />|" $csproj
              done

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c ${{ matrix.release.type }} -p:Version=0.0.0-rolling+${{ github.sha }}

      - name: Zip
        if: "! startsWith(github.event_name, 'pull_request')"
        run: 7z a -tzip -mx9 SharpHound${{ matrix.release.suffix }}.zip $PWD/bin/${{ matrix.release.type }}/net472/*

      - name: Update Rolling Release
        if: "! startsWith(github.event_name, 'pull_request')"
        uses: softprops/action-gh-release@v2
        with:
          name: Rolling Release (unstable)
          tag_name: rolling
          prerelease: true
          files: SharpHound${{ matrix.release.suffix }}.zip
          body: |
            Rolling release of SharpHound compiled from source (${{ github.sha }})
            This is automatically kept up-to-date with the `${{ github.ref_name }}` ${{ github.ref_type }}.
