name: Build

on:
  pull_request:
    branches: [ 2.X ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 5.0.x

      - name: Checkout SharpHoundCommon
        uses: actions/checkout@v6
        with:
          repository: SpecterOps/SharpHoundCommon
          ref: lfalslev/bed-7214 #v4
          path: SharpHoundCommon

      - name: Restore SharpHoundCommon Dependencies
        working-directory: SharpHoundCommon
        run: dotnet restore

      - name: Build SharpHoundCommon
        working-directory: SharpHoundCommon
        run: dotnet build --no-restore

      - name: Run ls SHC
        working-directory: SharpHoundCommon
        run: |
#          ls
#          ls .\src
#          ls .\src\CommonLib
#          ls .\src\CommonLib\bin
#          ls .\src\CommonLib\bin\Debug
#          ls .\src\CommonLib\bin\Debug\net472
#          ls .\src\CommonLib\bin\Release
#          ls .\src\CommonLib\bin\Release\net472
#          ls .\src\SharpHoundRPC
#          ls .\src\SharpHoundRPC\bin
          ls .\src\SharpHoundRPC\bin\Debug
          ls .\src\SharpHoundRPC\bin\Debug\net472
          ls .\src\SharpHoundRPC\bin\Release
          ls .\src\SharpHoundRPC\bin\Release\net472

      - name: Checkout SharpHound
        uses: actions/checkout@v6
        with:
          path: SharpHound
          
      - name: Run ls SH
        working-directory: SharpHound
        run: |
          ls ..
          ls ..\SharpHoundCommon\src\CommonLib\bin\Debug\net472
          ls ..\SharpHoundCommon\src\CommonLib\bin\Release\net472
          ls ..\SharpHoundCommon\src\SharpHoundRPC\bin\Debug\net472
          ls ..\SharpHoundCommon\src\SharpHoundRPC\bin\Release\net472

      - name: Check if local libs exist (from SharpHound perspective)
        working-directory: SharpHound
        run: |
          echo "Checking paths as SharpHound sees them..."
          if (Test-Path "..\SharpHoundCommon\src\CommonLib\bin\${{ env.CONFIG }}\net472\SharpHoundCommonLib.dll") {
            Write-Host "✓ CommonLib DLL found at relative path"
            Get-Item "..\SharpHoundCommon\src\CommonLib\bin\${{ env.CONFIG }}\net472\SharpHoundCommonLib.dll" | Select-Object FullName, Length
          } else {
            Write-Host "✗ CommonLib DLL NOT found at relative path"
          }
          
          if (Test-Path "..\SharpHoundCommon\src\SharpHoundRPC\bin\${{ env.CONFIG }}\net472\SharpHoundRPC.dll") {
            Write-Host "✓ RPC DLL found at relative path"
            Get-Item "..\SharpHoundCommon\src\SharpHoundRPC\bin\${{ env.CONFIG }}\net472\SharpHoundRPC.dll" | Select-Object FullName, Length
          } else {
            Write-Host "✗ RPC DLL NOT found at relative path"
          }

      - name: Restore SharpHound Dependencies
        working-directory: SharpHound
        run: dotnet restore

      - name: Build SharpHound
        working-directory: SharpHound
        run: dotnet build --no-restore -p:PreferLocalLibs=true