name: Build

on:
  pull_request:
    branches: [ 2.X ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Checkout repository
        uses: actions/checkout@v6
        
      - name: Build
        run: dotnet build -p:CommonSource=Dev