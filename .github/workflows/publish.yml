name: Publish

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        release:
          - type: Debug
            suffix: '+debug'
          - type: Release
            suffix: ''

    name: Build (${{ matrix.release.type }})

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # ratchet:actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: |
          VERSION=${{ github.ref_name }}
          dotnet build -c ${{ matrix.release.type }} -p:Version=${VERSION:1} -p:CommonSource=Stable

      - name: Zip
        run: 7z a -tzip -mx9 SharpHound_${{ github.ref_name }}${{ matrix.release.suffix }}_windows_x86.zip $PWD/bin/${{ matrix.release.type }}/net472/*

      - name: Checksum zip files
        run: |
          sha256sum SharpHound_${{ github.ref_name }}${{ matrix.release.suffix }}_windows_x86.zip > SharpHound_${{ github.ref_name }}${{ matrix.release.suffix }}_windows_x86.zip.sha256

      - name: Stage Release Files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: sharphound-${{ matrix.release.type }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          path: |
            SharpHound_${{ github.ref_name }}${{ matrix.release.suffix }}_windows_x86.zip
            SharpHound_${{ github.ref_name }}${{ matrix.release.suffix }}_windows_x86.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check Release Tag
        id: release_tag
        shell: bash
        run: |
          stable_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$GITHUB_REF_NAME" =~ $stable_tag_pattern ]]; then
            echo 'is_stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_stable=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download Release Files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8
        with:
          pattern: sharphound-*
          merge-multiple: true

      - name: Write Version File
        if: ${{ steps.release_tag.outputs.is_stable == 'true' }}
        run: printf '%s\n' "$GITHUB_REF_NAME" > version.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # ratchet:softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.release_tag.outputs.is_stable == 'false' }}
          fail_on_unmatched_files: true
          files: |
            SharpHound_${{ github.ref_name }}_windows_x86.zip
            SharpHound_${{ github.ref_name }}_windows_x86.zip.sha256
            SharpHound_${{ github.ref_name }}+debug_windows_x86.zip
            SharpHound_${{ github.ref_name }}+debug_windows_x86.zip.sha256
            ${{ steps.release_tag.outputs.is_stable == 'true' && 'version.txt' || '' }}
